plugins {
    id 'fabric-loom' version "${loom_version}"
}

minecraft_version = project.minecraft_version
simple_version = project.simple_version
version = project.mod_version
group = project.maven_group

def removedAssets = ['**/*PvPTiers*', '**/*pvptiers*', '**/pvptiers/**',
                     '**/classic*', '**/classic/**', '**/tiers/icon.png']

tasks.withType(org.gradle.language.jvm.tasks.ProcessResources).configureEach {
    exclude removedAssets
}

tasks.withType(org.gradle.api.tasks.bundling.AbstractArchiveTask).configureEach {
    exclude removedAssets
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url "https://maven.shedaniel.me/" }
    maven { url "https://maven.terraformersmc.com/releases/" }
}

loom {
    splitEnvironmentSourceSets()
    mods {
        "tiers" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    modApi "com.terraformersmc:modmenu:${modmenu_version}"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    filesMatching("fabric.mod.json") {
        expand "version": project.version, minecraft_version: project.minecraft_version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

sourceSets {
    smokeTest {
        compileClasspath += sourceSets.client.output + sourceSets.client.compileClasspath
        runtimeClasspath += output + compileClasspath + sourceSets.client.runtimeClasspath
    }
}

tasks.register('smokeTest', JavaExec) {
    dependsOn tasks.named('smokeTestClasses')
    classpath = sourceSets.smokeTest.runtimeClasspath
    mainClass = 'NewTiersSmokeTest'
    workingDir = projectDir
}

tasks.named('check') {
    dependsOn tasks.named('smokeTest')
}

def sourceBundle = tasks.register('sourceBundle', Zip) {
    archiveFileName = 'new-tiers-source.zip'
    destinationDirectory = layout.buildDirectory.dir('sourceBundle')
    from(projectDir) {
        include 'src/**', 'gradle/**', 'gradlew', 'gradlew.bat'
        include 'build.gradle', 'settings.gradle', 'gradle.properties', 'LICENSE', 'NOTICE', 'README.md'
    }
}

jar {
    dependsOn(sourceBundle)
    from('LICENSE')
    from('NOTICE')
    from(sourceBundle) {
        into 'META-INF'
    }
}
